# The orchestrator runs as a web server (POST /api/ask, port 4000) for the website.
# You can still ask from the terminal inside the same pod:
#   kubectl exec -n koll deploy/orchestrator -- npx tsx agents/orchestrator/src/index.ts "Din fråga"
# Reach the API from your Mac with: kubectl port-forward -n koll svc/orchestrator 4000:4000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: koll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      # Kubernetes would otherwise inject env vars like CATEGORIZER_PORT=tcp://10.x.x.x:4001 for every
      # Service, which collides with our own CATEGORIZER_PORT. We use DNS names (http://categorizer:4001).
      enableServiceLinks: false
      containers:
        - name: orchestrator
          image: koll-agent:latest
          imagePullPolicy: Never
          command: ["npx", "tsx", "agents/orchestrator/src/server.ts"]
          ports:
            - containerPort: 4000
          # From your .env (Secret) and config.yaml (ConfigMap). If both have the same
          # name, the ConfigMap wins because it comes last, and env: below wins over both.
          envFrom:
            - secretRef:
                name: koll-secrets
            - configMapRef:
                name: koll-config
          env:
            # Can only touch the daily Gemini call counter. $(NAME) comes from the Secret above.
            - name: BUDGET_DATABASE_URL
              value: postgres://budget_rw:$(BUDGET_DB_PASSWORD)@db:5432/$(POSTGRES_DB)
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /gcloud/adc.json
          volumeMounts:
            - name: gcloud
              mountPath: /gcloud
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: gcloud
          secret:
            secretName: gcloud-adc
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: koll
spec:
  selector:
    app: orchestrator
  ports:
    - port: 4000
      targetPort: 4000
