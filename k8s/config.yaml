# Settings that are NOT secret. Passwords and the Google login live in Secrets
# created with kubectl (see k8s/README.md), so they never end up in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: koll-config
  namespace: koll
data:
  AI_PROVIDER: gemini
  VERTEX_REGION: global
  # Where the orchestrator looks for agents: the Service names below
  AGENT_URLS: http://categorizer:4001,http://analyst:4002
  # Max Gemini calls per day across all agents
  GEMINI_DAILY_LIMIT: "150"
  ROUTER_MODEL: gemini-3.5-flash-lite
  # Proxies in front of the API (load balancer or ingress), so the hourly question limit sees each
  # visitor's own address. A number only, never "true". With kubectl port-forward there is no proxy,
  # so this only matters once the API is behind one. Check the number at deploy time.
  TRUST_PROXY: "1"
