services:
  db:
    image: postgres:17
    # Postgres reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from .env (gitignored)
    env_file: .env
    ports:
    - "5432:5432"
    # Named volume: the data survives `docker compose down`; `down -v` wipes it
    volumes:
    - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
